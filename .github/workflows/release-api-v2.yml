name: Release (api-v2)

# Manual release of the CLI built against the go.mod-pinned anytype-heart
# (>= v0.51.0, serves the API v2 surface) with NO mcp-enhance patch applied.
# Exists as the counterpart to release-mcp-enhance.yml until upstream anytype-cli
# bumps its heart pin past v0.50.x; retire it once that happens.
# Publishes a multi-arch image to ghcr.io.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish (e.g. api-v2)"
        required: false
        default: "api-v2"

permissions:
  contents: read
  packages: write

concurrency:
  group: api-v2-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
            musl_cc: x86_64-linux-musl-gcc
          - target: linux-arm64
            os: ubuntu-24.04-arm
            musl_cc: aarch64-linux-musl-gcc

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Stamp version
        id: stamp
        shell: bash
        run: |
          echo "go_version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Build static musl binary
        env:
          VERSION: ${{ inputs.image_tag }}
          COMMIT: ${{ steps.stamp.outputs.commit }}
          BUILD_TIME: ${{ steps.stamp.outputs.build_time }}
          GIT_STATE: clean
          MUSL_CC: ${{ matrix.musl_cc }}
          TARGET: ${{ matrix.target }}
          GO_VERSION: ${{ steps.stamp.outputs.go_version }}
        shell: bash
        run: |
          set -euo pipefail
          GO_MOD_CACHE="$(go env GOMODCACHE)"
          GO_BUILD_CACHE="$(go env GOCACHE)"
          mkdir -p "$GO_MOD_CACHE" "$GO_BUILD_CACHE"
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -v "$GO_MOD_CACHE:/go/pkg/mod" \
            -v "$GO_BUILD_CACHE:/root/.cache/go-build" \
            -e VERSION -e COMMIT -e BUILD_TIME -e GIT_STATE -e MUSL_CC -e TARGET -e GOTOOLCHAIN=auto \
            "golang:${GO_VERSION#go}-alpine" \
            sh -c 'apk add --no-cache gcc musl-dev make curl tar git &&
                   git config --global --add safe.directory /src &&
                   ln -sf /usr/bin/gcc "/usr/local/bin/${MUSL_CC}" &&
                   make "build-${TARGET}"'
          sudo chown -R "$(id -u):$(id -g)" "$GO_MOD_CACHE" "$GO_BUILD_CACHE" dist
          ls -la dist/

      - name: Compress binary
        env:
          VERSION: ${{ inputs.image_tag }}
          TARGET: ${{ matrix.target }}
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          cp "anytype-${TARGET}" anytype
          tar czf "../anytype-cli-${VERSION}-${TARGET}.tar.gz" anytype

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: anytype-cli-${{ matrix.target }}
          path: anytype-cli-*.tar.gz

  publish:
    name: Publish image
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork (Dockerfile)
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: anytype-cli-*
          merge-multiple: true
          path: artifacts

      - name: Extract linux binaries
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf artifacts/anytype-cli-${{ inputs.image_tag }}-linux-amd64.tar.gz
          mv anytype anytype-linux-amd64
          tar -xzf artifacts/anytype-cli-${{ inputs.image_tag }}-linux-arm64.tar.gz
          mv anytype anytype-linux-arm64
          ls -la anytype-linux-*

      - name: Compute lowercase image name
        id: image
        shell: bash
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${OWNER}/anytype-cli" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.image.outputs.name }}:${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=anytype-cli built against anytype-heart v0.51.x (API v2, unpatched)
            org.opencontainers.image.version=${{ inputs.image_tag }}
